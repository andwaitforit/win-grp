[project]
name = "wingrp-workers"
version = "0.1.0"
description = "win-grp ingestion workers (FCC OPIF, FEC, polls)"
authors = [
    { name = "Andrew Horgan", email = "ahorgan0@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
wingrp = "wingrp_workers:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
