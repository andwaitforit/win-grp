# Internal pilot race: MA-01 (Richard Neal), 2026 cycle.
# Seed data for Phase 0 / Pilot Slice. See docs/pilot/MA-01.md for sources.
# Fields marked `verify: true` or `null` must be resolved from the FCC OPIF
# facility API / OpenFEC before use. Do not guess facility or committee IDs.

race:
  id: us-house-ma-01-2026
  state: MA
  office: US House
  district: "01"
  cycle: 2026
  dates:
    primary: 2026-09-01
    general: 2026-11-03
  lur_windows:            # candidates get Lowest Unit Rate
    primary: { start: 2026-07-18, end: 2026-09-01 }   # 45 days before primary
    general: { start: 2026-09-04, end: 2026-11-03 }   # 60 days before general
  geography: >-
    Berkshire and Hampden counties; western Franklin County; western and
    southern Hampshire County; southwestern edge of Worcester County.

candidates:
  - key: neal
    name: Richard E. Neal
    short_name: Neal
    our_side: true
    windows: [primary, general]
    party: DEM
    incumbent: true
    status: general_nominee
    fec_candidate_id: H8MA02041
    committees:
      - { name: Richard E. Neal for Congress Committee, fec_id: C00226522, role: principal }
    opif_purchaser_aliases: ["Richard E Neal for Congress", "Neal for Congress", "Richard Neal", "Richard Neal Congress Dist 1 Mass"]
    # WNYT files Neal under a district folder "MA-01"; match on file name there.
  - key: milleron
    name: Nadia Milleron
    short_name: Milleron
    windows: [general]
    party: IND
    incumbent: false
    status: general_nominee
    fec_candidate_id: H4MA01091
    committees:
      - { name: Nadia for Congress, fec_id: C00868927, role: principal }
    opif_purchaser_aliases: ["Nadia for Congress", "Nadia Milleron", "Nadia for Congress Nadia Milleron"]
  - key: whalen
    name: Jeromie Whalen
    short_name: Whalen
    windows: [primary]
    party: DEM
    incumbent: false
    status: lost_primary        # 2026-09-01; primary-window backtest only
    fec_candidate_id: null      # resolve via OpenFEC
    committees:
      - { name: Jeromie Whalen for Congress, fec_id: null, role: principal }
    opif_purchaser_aliases: ["Whalen for Congress", "Jeromie Whalen", "Whalen Committee For Congress"]
  # Republican general-election candidate: none confirmed as of 2026-09-24. Verify.

# Outside groups that file political buys in this race. Add one entry per
# purchaser seen in the political files so buys.csv can reference it, e.g.
#   - { key: wmpac, name: "Western Mass Future PAC", short_name: WMF PAC,
#       side: opp, windows: [general], aliases: ["WMF PAC"] }
outside_groups: []

# Outside groups (super PACs, party committees, issue advertisers) are
# discovered from OPIF "Non-Candidate Issue Ads" and Federal/US House folders
# on the stations below, plus FEC Schedule E filings that name these candidates.

markets:
  - key: spr
    dma: Springfield-Holyoke
    role: primary             # covers Hampden, Hampshire, Franklin
    stations:
      - { call_sign: WWLP, opif_entity_id: "6868",    network: NBC, service: tv, notes: "22; subchannels carry other nets. Confirmed 2026 buys by Neal and Whalen" }
      - { call_sign: WGGB-TV, opif_entity_id: "25682", network: ABC/CBS, service: tv, notes: "40; Fox on a subchannel. Confirmed 2026 buys" }
      - { call_sign: WSHM-LD, network: CBS, service: tv, opif_entity_id: null, notes: "Low-power CBS 3. No OPIF facility of its own (checked 2026-10-05); WSHM buys are filed in WGGB-TV political folders, often named WSHM in the file name" }
  - key: alb
    dma: Albany-Schenectady-Troy
    short_name: Albany
    role: primary             # covers Berkshire County
    note: "Albany GRPs cover the whole market. Only about 1 in 10 of its TV homes are in Berkshire County."
    stations:
      - { call_sign: WNYT, opif_entity_id: "73363", network: NBC, service: tv, notes: "Confirmed 2026 Neal primary buy (~$25K)" }
      - { call_sign: WRGB, opif_entity_id: "73942", network: CBS, service: tv }
      - { call_sign: WTEN, opif_entity_id: "74422", network: ABC, service: tv }
      - { call_sign: WXXA-TV, opif_entity_id: "11970", network: FOX, service: tv }
      - { call_sign: WCWN, opif_entity_id: "73264", network: CW, service: tv }
  - key: hfd
    dma: Hartford-New Haven
    role: watch_only          # spill-in; rarely bought for MA-01
    stations: []              # populate if filings appear
  - key: bos
    dma: Boston
    role: watch_only          # SW Worcester County edge; expensive, unlikely
    stations: []

  # Cable (Spectrum Reach / Comcast zones in Berkshire and Pioneer Valley) is
  # probably material in this race. Cable political files are in OPIF too.
  # Consider pulling cable into the pilot. See docs/pilot/MA-01.md.

# Figures reported in the press, used ONLY to sanity-check the pilot's
# extraction. These are not backtest ground truth; the user supplies that.
press_reference_points:
  source: "Western Mass Politics & Insight, Aug 2026 (from FCC political files)"
  window: primary
  items:
    - { purchaser: Neal,   stations: [WWLP],               approx_usd: 70000, note: "incl. subchannels, mostly news" }
    - { purchaser: Neal,   stations: [WGGB-TV, WSHM-LD],   approx_usd: 35000 }
    - { purchaser: Neal,   stations: [WNYT],               approx_usd: 25000 }
    - { purchaser: Whalen, stations: [WWLP],               approx_usd: 31800, note: "news + SNL reruns" }
    - { purchaser: Whalen, stations: [WGGB-TV, WSHM-LD],   approx_usd: 14000, note: "incl. subchannels" }

backtest:
  ground_truth: pending       # user will supply GRP data later
  windows: [primary, general]
